<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F2F4F7">
  {% seo %}
  {% feed_meta %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>
<div class="wrap">
  <nav aria-label="Main">
    <a href="{{ '/' | relative_url }}"><strong>rami-dev.com</strong></a>
    <div class="links">
      <a href="{{ '/products/' | relative_url }}"{% if page.url contains '/products' %} aria-current="page"{% endif %}>Products</a>
      <a href="{{ '/blog/' | relative_url }}"{% if page.url contains '/blog' %} aria-current="page"{% endif %}>Blog</a>
      <a href="{{ '/contact/' | relative_url }}"{% if page.url contains '/contact' %} aria-current="page"{% endif %}>Contact</a>
    </div>
  </nav>
  <main>{{ content }}</main>
  {% include newsletter.html %}
  <footer>
    <span>© {{ 'now' | date: "%Y" }} Rami Mustafa</span>
    <span class="flinks">
      <a href="{{ site.social.github }}" rel="noopener">GitHub</a>
      <a href="{{ site.social.x }}" rel="noopener">X</a>
      <a href="{{ site.social.linkedin }}" rel="noopener">LinkedIn</a>
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    </span>
  </footer>
</div>
</body>
</html>
